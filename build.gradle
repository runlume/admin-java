plugins {
	id 'java'
	id 'checkstyle'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'app.runlume'
version = '0.1.0'
description = 'Runlume 标准后台后端'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

sourceSets {
	jooqCodegen {
		java.srcDir 'src/jooqCodegen/java'
	}
}

def migrationDirectory = layout.projectDirectory.dir('src/main/resources/db/migration')
def generatedJooqDirectory = layout.buildDirectory.dir('generated/sources/jooq/main')
sourceSets.main.java.srcDir generatedJooqDirectory

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-jooq'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-session-jdbc'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.postgresql:postgresql'
	implementation platform(libs.spring.modulith.bom)
	implementation libs.spring.modulith.api
	implementation libs.platform.integration.spring.boot.starter

	jooqCodegenImplementation 'org.flywaydb:flyway-core'
	jooqCodegenImplementation 'org.flywaydb:flyway-database-postgresql'
	jooqCodegenImplementation 'org.postgresql:postgresql'
	jooqCodegenImplementation 'org.jooq:jooq-codegen'
	jooqCodegenImplementation 'org.jooq:jooq-meta'
	jooqCodegenImplementation libs.testcontainers.postgresql

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation platform(libs.spring.modulith.bom)
	testImplementation libs.spring.modulith.starter.test
	testImplementation libs.testcontainers.postgresql
	testImplementation libs.testcontainers.junit
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('generateJooq', JavaExec) {
	group = 'jooq'
	description = '从完整 Flyway Migration 迁入的临时 PostgreSQL 生成 jOOQ 类型。'
	dependsOn tasks.named('compileJooqCodegenJava')
	classpath = sourceSets.jooqCodegen.runtimeClasspath
	mainClass = 'app.runlume.admin.codegen.JooqCodegen'
	args migrationDirectory.asFile.absolutePath, generatedJooqDirectory.get().asFile.absolutePath
	inputs.files sourceSets.jooqCodegen.runtimeClasspath
	inputs.dir migrationDirectory
	outputs.dir generatedJooqDirectory
}

tasks.named('compileJava') {
	dependsOn tasks.named('generateJooq')
	options.compilerArgs.add('-Xlint:-processing')
}

tasks.named('checkstyleMain') {
	source = fileTree('src/main/java')
}

checkstyle {
	configFile = layout.projectDirectory.file('config/checkstyle/checkstyle.xml').asFile
	toolVersion = libs.versions.checkstyle.get()
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.compilerArgs.addAll(['-parameters', '-Xlint:all', '-Werror'])
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
	testLogging {
		events 'failed', 'skipped'
		exceptionFormat = 'full'
	}
}

tasks.withType(AbstractArchiveTask).configureEach {
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}
